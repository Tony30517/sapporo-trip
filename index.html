<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>札幌・小樽 4日行程</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#18242f;
    --muted:#61717f;
    --line:#d7e0e7;
    --paper:#eaf1f5;
    --card:#ffffff;
    --steel:#2f7ba3;     /* 移動 */
    --gold:#c47d15;      /* 用餐 */
    --pine:#2f8a6a;      /* 景點 */
    --plum:#7d5aa6;      /* 購物 */
    --grey:#8b98a3;      /* 彈性 */
    --note-bg:#f3f7ef;
    --note-edge:#8aa96f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.6;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}

  header.top{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    padding:20px 0 8px;
    border-bottom:1px solid var(--line);
  }
  .kicker{font-size:12px;letter-spacing:.14em;color:var(--steel);font-weight:700}
  h1{font-size:26px;font-weight:900;letter-spacing:-.01em;margin-top:2px}
  h1 .sep{color:var(--line);font-weight:400;margin:0 6px}

  nav.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav.tabs button{
    flex:1 0 auto;min-width:0;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:700;
    padding:8px 6px 9px;border-radius:10px;cursor:pointer;
    line-height:1.25;text-align:center;transition:.15s;
  }
  nav.tabs button .d{display:block;font-size:15px;color:var(--ink)}
  nav.tabs button .t{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
  nav.tabs button[aria-selected="true"]{
    background:var(--ink);border-color:var(--ink);
  }
  nav.tabs button[aria-selected="true"] .d,
  nav.tabs button[aria-selected="true"] .t{color:#fff}

  section.day{display:none;padding-top:22px}
  section.day.on{display:block}

  .dayhead{margin-bottom:6px}
  .dayhead .theme{font-size:19px;font-weight:900}
  .dayhead .meta{font-size:13px;color:var(--muted);margin-top:2px}

  .flag{
    margin:14px 0 4px;padding:10px 12px;border-radius:10px;
    background:#fdf3e0;border:1px solid #ecd3a3;color:#8a5a11;
    font-size:13px;font-weight:500;line-height:1.55;
  }
  .flag b{font-weight:700}

  ol.tl{list-style:none;position:relative;margin-top:16px}
  ol.tl::before{
    content:"";position:absolute;left:64px;top:6px;bottom:6px;
    width:2px;background:var(--line);
  }
  li.ev{position:relative;padding:0 0 20px 84px;min-height:24px}
  li.ev .time{
    position:absolute;left:0;top:0;width:56px;text-align:right;
    font-size:13px;font-weight:700;color:var(--ink);line-height:1.35;
  }
  li.ev .time span{display:block;font-size:11px;font-weight:400;color:var(--muted)}
  li.ev .dot{
    position:absolute;left:59px;top:5px;width:12px;height:12px;border-radius:50%;
    background:#fff;border:2.5px solid var(--grey);
  }
  li.ev[data-k="move"]  .dot{border-color:var(--steel)}
  li.ev[data-k="meal"]  .dot{border-color:var(--gold);background:var(--gold)}
  li.ev[data-k="see"]   .dot{border-color:var(--pine);background:var(--pine)}
  li.ev[data-k="shop"]  .dot{border-color:var(--plum);background:var(--plum)}
  li.ev[data-k="buf"]   .dot{border-color:var(--grey);border-style:dashed}

  .ev .body{font-size:14.5px}
  .ev .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .ev .title{font-weight:700}
  .ev[data-k="move"] .title{font-weight:500;color:#3b4b57}
  .tag{
    font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;
    color:#fff;letter-spacing:.03em;white-space:nowrap;position:relative;top:-1px;
  }
  .tag.move{background:var(--steel)}
  .tag.meal{background:var(--gold)}
  .tag.see{background:var(--pine)}
  .tag.shop{background:var(--plum)}
  .tag.buf{background:var(--grey)}
  .ev .desc{color:var(--muted);font-size:13px;margin-top:2px}
  .ev .opts{margin-top:6px;font-size:13px}
  .ev .opts .o{
    display:block;padding:5px 10px;margin-top:5px;border-radius:8px;
    background:#f4f7fa;border-left:3px solid var(--line);color:#3b4b57;
  }
  .ev .opts .o b{color:var(--ink)}

  .notes{
    margin-top:24px;background:var(--note-bg);
    border:1px solid #d8e4c9;border-radius:14px;padding:16px 18px;
  }
  .notes h3{font-size:14px;font-weight:900;color:#4d6b34;margin-bottom:8px;letter-spacing:.02em}
  .notes ul{list-style:none;font-size:13px;color:#37432c}
  .notes li{position:relative;padding:5px 0 5px 18px;line-height:1.6;border-top:1px dashed #d0dec0}
  .notes li:first-child{border-top:0}
  .notes li::before{content:"";position:absolute;left:3px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--note-edge)}
  .notes b{font-weight:700;color:#2e3a24}
  .notes a{color:#2f7ba3;word-break:break-all}

  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .legend .move{background:var(--steel)} .legend .meal{background:var(--gold)}
  .legend .see{background:var(--pine)} .legend .shop{background:var(--plum)}
  .legend .buf{background:#fff;border:2px dashed var(--grey)}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px}
</style>
</head>

const TAGLABEL={move:"移動",meal:"用餐",see:"景點",shop:"購物",buf:"彈性"};

function render(){
 const tabs=document.getElementById('tabs');
 const main=document.getElementById('main');
 DAYS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.role="tab"; b.setAttribute('aria-selected', i===0);
  b.innerHTML=`<span class="d">${d.tab}</span><span class="t">(${d.dow})</span>`;
  b.onclick=()=>select(i);
  tabs.appendChild(b);

  const s=document.createElement('section');
  s.className='day'+(i===0?' on':'');
  let evs=d.events.map(ev=>{
   const opts=ev.opts?`<div class="opts">${ev.opts.map(o=>`<span class="o">${o}</span>`).join('')}</div>`:'';
   const desc=ev.desc?`<div class="desc">${ev.desc}</div>`:'';
   const end=ev.e?`<span>${ev.e}</span>`:'';
   return `<li class="ev" data-k="${ev.k}">
     <div class="time">${ev.t}${end}</div>
     <div class="dot"></div>
     <div class="body"><div class="head"><span class="title">${ev.title}</span><span class="tag ${ev.k}">${TAGLABEL[ev.k]}</span></div>${desc}${opts}</div>
   </li>`;
  }).join('');
  const flag=d.flag?`<div class="flag">${d.flag}</div>`:'';
  const notes=`<div class="notes"><h3>注意事項</h3><ul>${d.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
  s.innerHTML=`<div class="dayhead"><div class="theme">${d.theme}</div><div class="meta">${d.meta}</div></div>${flag}<ol class="tl">${evs}</ol>${notes}`;
  main.appendChild(s);
 });
}
function select(i){
 document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
 document.querySelectorAll('.day').forEach((s,j)=>s.classList.toggle('on',j===i));
 window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
